[package]
name = "donation-relay-source-proposal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "donation_relay_source_proposal"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
spl-token-2022 = { version = "=6.0.0", features = ["no-entrypoint"] }

# Independent workspace: never inherit or alter the parent repository workspace.
[workspace]
resolver = "2"

[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1

[features]
# Recognized by the SDK entrypoint macro. Defaults install the real SDK heap/panic.
custom-heap = []
custom-panic = []
